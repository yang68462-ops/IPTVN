name: Update IPTV List

on:
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击按钮测试
  watch:
    types: [started]
  schedule:
    - cron: '0 0,12 * * *' # 每天两次，过于频繁可能被 GitHub 封禁

env:
  TZ: Asia/Shanghai

jobs:
  Update:
    runs-on: ubuntu-latest
    permissions: # 赋予 Action 写入权限
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: GetTime
      id: date
      run: echo "date=$(date +'%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_OUTPUT

    - name: Update Files
      run: |
        # 创建临时文件夹防止干扰
        mkdir -p temp

        # fetch：下载上游，只有成功且非空才覆盖，失败则保留旧文件
        fetch() {
          if wget -q --timeout=30 "$1" -O "temp/dl.tmp" && [ -s temp/dl.tmp ]; then
            mv temp/dl.tmp "$2"
            echo "OK: $2"
            return 0
          else
            rm -f temp/dl.tmp
            echo "FAIL: $1，保留旧文件"
            return 1
          fi
        }

        # 1. 央视源 (IPv6)
        if fetch https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u temp/ipv6.m3u; then
          sed -n '/央视/,+1p' temp/ipv6.m3u > CCTV.m3u
          sed -i '1i #EXTM3U' CCTV.m3u
          sed -i '/^\s*$/d' CCTV.m3u
        fi

        # 2. 央视源 (IPv4)
        if fetch https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/index.m3u temp/index.m3u; then
          sed -n '/央视高清/,+1p' temp/index.m3u > CCTV-IPV4.m3u
          sed -i '1i #EXTM3U' CCTV-IPV4.m3u
          sed -i '/^\s*$/d' CCTV-IPV4.m3u
        fi

        # 3. 卫视源 (IPv6)
        if [ -f temp/ipv6.m3u ]; then
          sed '/央视/,+1d' temp/ipv6.m3u > CNTV.m3u # 移除央视，保留其余
          sed -i '/^\s*$/d' CNTV.m3u
        fi

        # 4. 卫视源 (IPv4)
        if [ -f temp/index.m3u ]; then
          sed -n '/卫视高清/,+1p' temp/index.m3u > CNTV-IPV4.m3u
          sed -i '1i #EXTM3U' CNTV-IPV4.m3u
          sed -i '/^\s*$/d' CNTV-IPV4.m3u
        fi

        # 5. 港澳台 (注意：外部源可能失效，失败保留旧文件)
        if fetch "https://raw.githubusercontent.com/Mitchll1214/m3u/main/港澳台.m3u" temp/gat.m3u; then
          sed -n '/港澳台/{N;p;}' temp/gat.m3u > GAT.m3u
          sed -i '1i #EXTM3U' GAT.m3u
        fi

        # 6. 整合总表 IPTV.m3u (IPv6为主)
        echo "#EXTM3U" > IPTV.m3u
        grep -v "#EXTM3U" CCTV.m3u >> IPTV.m3u
        grep -v "#EXTM3U" CNTV.m3u >> IPTV.m3u
        grep -v "#EXTM3U" GAT.m3u >> IPTV.m3u
        sed -i '/^\s*$/d' IPTV.m3u

        # 7. 整合总表 IPV4.m3u
        echo "#EXTM3U" > IPV4.m3u
        grep -v "#EXTM3U" CCTV-IPV4.m3u >> IPV4.m3u
        grep -v "#EXTM3U" CNTV-IPV4.m3u >> IPV4.m3u
        sed -i '/^\s*$/d' IPV4.m3u

        # 8. 节目源 EPG（失败保留旧文件）
        fetch https://epg.112114.xyz/pp.xml EPG.xml || true

        # 9. 成人源（自动更新上游，失败保留旧文件）
        if fetch http://adultiptv.net/chs.m3u temp/adult.m3u; then
          sed 's/XXX/成人/g' temp/adult.m3u > Adult.m3u
          sed -i 's/AdultIPTV.net //g' Adult.m3u
          sed -i '/^\s*$/d' Adult.m3u
        fi

        echo "Auto Update IPTV in ${{ steps.date.outputs.date }}" > README.md

    - name: Health Check Streams
      run: |
        # 死链检查：只剔除确定已死的（DNS失败/404），超时、403、IPv6一律保留
        python3 scripts/check_streams.py IPTV.m3u IPV4.m3u Adult.m3u

    - name: Build tvbox.json
      run: |
        # 根据 sites.json 和 m3u 文件自动生成 tvbox.json
        python3 scripts/build_tvbox.py

    - name: Push To Branch
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        # 强制更新 Files 分支
        git checkout --orphan latest_branch
        git add -A
        git commit -am "${{ steps.date.outputs.date }}"
        git branch -M Files
        git push -f origin Files
